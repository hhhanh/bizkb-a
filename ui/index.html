<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizKB-A — Governed agent orchestration demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F0; --sheet:#FFFFFF; --ink:#1B2A41; --ink-2:#4A5B70; --ink-3:#7D8B9B;
  --rule:#D5DCDF; --indigo:#26457A; --indigo-soft:#E4EAF4;
  --ok:#2D6A4F; --ok-soft:#E3F0E8; --bad:#A12F2F; --bad-soft:#F6E3E1;
  --wait:#9A6A12; --wait-soft:#F7EDD7; --focus:#3B6FD1;
  --sans:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161D; --sheet:#18202A; --ink:#E6ECF2; --ink-2:#A9B6C4; --ink-3:#7C8A99;
    --rule:#2B3542; --indigo:#8FB0E8; --indigo-soft:#1F2C42;
    --ok:#7CC49E; --ok-soft:#18302A; --bad:#F08A80; --bad-soft:#3A1F1F;
    --wait:#E2B55B; --wait-soft:#3A2F17; --focus:#8FB0E8;
  }
}
:root[data-theme="dark"]{
  --paper:#11161D; --sheet:#18202A; --ink:#E6ECF2; --ink-2:#A9B6C4; --ink-3:#7C8A99;
  --rule:#2B3542; --indigo:#8FB0E8; --indigo-soft:#1F2C42;
  --ok:#7CC49E; --ok-soft:#18302A; --bad:#F08A80; --bad-soft:#3A1F1F;
  --wait:#E2B55B; --wait-soft:#3A2F17; --focus:#8FB0E8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--rule);background:var(--sheet)}
.wrap.bar{display:flex;align-items:center;gap:16px;padding:14px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex:1;min-width:240px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em}
.brand p{margin:0;color:var(--ink-2);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--sheet)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--indigo-soft);color:var(--indigo)}

.intro{padding:22px 0 8px;max-width:78ch}
.intro h2{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:700;letter-spacing:-0.015em}
.intro p{margin:0;color:var(--ink-2)}

.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:16px 0 40px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.grid>*,.stage,.stage-b{min-width:0}
@media (max-width:600px){th:nth-child(5),td:nth-child(5){display:none}.excl{font-size:12px}}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.panel h3{margin:0 0 10px;font-size:16px;font-weight:700}
.muted{color:var(--ink-3);font-size:13px}
.scen-group{margin:0 0 10px}
.scen-group h4{margin:10px 0 6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.scen{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 10px;margin:0 0 6px;cursor:pointer}
.scen:hover{border-color:var(--indigo)}
.scen[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.scen b{font-weight:500;color:var(--indigo);margin-right:6px}
.scen span{font-size:14px}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
textarea,input[type=number],input[type=text],select{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
fieldset{border:1px solid var(--rule);border-radius:8px;margin:12px 0 0;padding:6px 12px 12px}
legend{font-size:13px;font-weight:500;padding:0 6px;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.cats{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:14px}
.cats label{display:flex;gap:5px;align-items:center}
.run{margin-top:14px;width:100%;border:0;background:var(--indigo);color:var(--sheet);font-weight:700;padding:11px;border-radius:8px;cursor:pointer;font-size:15px}
.run:hover{filter:brightness(1.08)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* ledger */
.ledger{display:flex;flex-direction:column;gap:14px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.stage{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.stage-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.stage-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--indigo-soft);color:var(--indigo);flex:none}
.stage-h h3{margin:0;font-size:16px;flex:1}
.pill{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--wait-soft);color:var(--wait)} .pill.skip{background:var(--paper);color:var(--ink-3)}
.stage-b{padding:12px 16px}
.stage.skipped .stage-b{color:var(--ink-3)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.loglist{margin:0;padding-left:18px;font-size:14px}
.loglist li{margin:3px 0}
.loglist .rej{color:var(--bad)} .loglist .acc{color:var(--ok)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:500;color:var(--ink-2);font-size:13px}
.deg{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--indigo-soft);color:var(--indigo)}
.excl{color:var(--bad);font-size:13px;margin-top:3px}
.excl s{color:var(--ink-3)}

/* norm seals — the one bold element */
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seal{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet);min-height:64px;position:relative}
.seal .code{font-weight:700;font-size:15px;letter-spacing:.02em}
.seal .t{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.seal.pass{border-color:var(--ok);}
.seal.pass .code{color:var(--ok)}
.seal.fail{border-color:var(--bad);background:var(--bad-soft)}
.seal.fail .code{color:var(--bad)}
.seal.fail::after{content:"";position:absolute;top:8px;right:9px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bad)}
.seal.na{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .seal.fail{animation:stamp .35s ease-out both}
  @keyframes stamp{0%{transform:scale(1.08);opacity:0}100%{transform:scale(1);opacity:1}}
}
.viol{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:0;font-size:14px}

.exec-step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.exec-step:last-child{border-bottom:0}
.exec-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);margin-top:2px}
.exec-step.done .exec-dot{border-color:var(--ok);background:var(--ok)}
.exec-step.denied .exec-dot{border-color:var(--bad);background:var(--bad)}
.exec-step.waiting .exec-dot{border-color:var(--wait)}
.exec-title{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.withheld{text-decoration:line-through;color:var(--ink-3)}
.hitl{margin-top:8px;padding:10px 12px;background:var(--wait-soft);border-radius:8px}
.hitl p{margin:0 0 8px;font-size:14px;color:var(--wait)}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500;margin-right:6px}
.btn.primary{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
details{margin-top:4px}
summary{cursor:pointer;font-weight:500;color:var(--indigo)}
pre.ttl{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;overflow-x:auto;max-height:420px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp{border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.cmp h4{margin:0 0 4px;font-size:14px}
.cmp .big{font-size:28px;font-weight:700}
.cmp.bad .big{color:var(--bad)} .cmp.ok .big{color:var(--ok)}

/* KB tab */
.kbgrid{display:grid;grid-template-columns:1fr;gap:16px;padding:16px 0 40px}
.badge{font-size:12px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.badge.att{background:var(--ok-soft);color:var(--ok)} .badge.trap{background:var(--bad-soft);color:var(--bad)}
.badge.draft{background:var(--wait-soft);color:var(--wait)}
footer{border-top:1px solid var(--rule);padding:16px 0 28px;color:var(--ink-3);font-size:13px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><h1>BizKB-A</h1><p data-i="tagline"></p></div>
    <span id="mode" class="badge att" title=""></span>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-run" aria-selected="true" data-i="tabRun"></button>
      <button role="tab" id="tab-kb" aria-selected="false" data-i="tabKb"></button>
    </nav>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-vi" aria-pressed="false">VI</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-run">
    <div class="intro"><h2 data-i="introH"></h2><p data-i="introP"></p></div>
    <div class="grid">
      <aside class="panel" aria-labelledby="req-h">
        <h3 id="req-h" data-i="reqH"></h3>
        <div id="scenarios"></div>
        <label class="f" for="req" data-i="reqLabel"></label>
        <textarea id="req"></textarea>
        <fieldset id="ctxset">
          <legend data-i="ctxLegend"></legend>
          <p class="muted" data-i="ctxHint" style="margin:2px 0 0"></p>
          <div class="row2">
            <div><label class="f" for="amount" data-i="amount"></label><input id="amount" type="number" min="0" step="10000"></div>
            <div><label class="f" for="merchant" data-i="merchant"></label><select id="merchant"></select></div>
          </div>
          <label class="f" for="category" data-i="category"></label><select id="category"></select>
          <label class="chk"><input type="checkbox" id="hasMandate"> <span data-i="mandateOn"></span></label>
          <div id="mandateBox">
            <div class="row2">
              <div><label class="f" for="cap" data-i="cap"></label><input id="cap" type="number" min="0" step="10000"></div>
              <div><label class="f" for="validDays" data-i="validDays"></label><input id="validDays" type="number" step="1"></div>
            </div>
            <label class="f" data-i="allowedCats"></label>
            <div class="cats" id="mandCats"></div>
          </div>
        </fieldset>
        <label class="chk"><input type="checkbox" id="compare" checked> <span data-i="compareLbl"></span></label>
        <button class="run" id="runBtn" data-i="runBtn"></button>
        <p class="note" data-i="note"></p>
      </aside>
      <section class="ledger" id="ledger" aria-live="polite"></section>
    </div>
  </section>

  <section id="view-kb" class="hide">
    <div class="intro"><h2 data-i="kbH"></h2><p data-i="kbP"></p></div>
    <div class="kbgrid">
      <div class="panel"><h3 data-i="agentsH"></h3><div class="tbl-wrap"><table id="agentsTbl"></table></div></div>
      <div class="panel"><h3 data-i="normsH"></h3><div class="seals" id="normsAll"></div></div>
      <div class="panel">
        <h3 data-i="annotH"></h3>
        <p class="muted" data-i="annotP"></p>
        <pre class="ttl" id="cardJson"></pre>
        <button class="btn primary" id="annotBtn" data-i="annotBtn"></button>
        <div id="annotOut"></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap" data-i="footer"></div></footer>

/* ======================= Engine ======================= */
const norm = s => s.normalize("NFC").toLowerCase().replace(/\s+/g," ").trim();
const isTask = id => { let x=id; const seen=new Set(); while(x && TASKS[x] && !seen.has(x)){ if(x==="Task") return id!=="Task"; seen.add(x); x=TASKS[x].parent; } return false; };
const isSub = (a,b) => { let x=a; const seen=new Set(); while(x && !seen.has(x)){ if(x===b) return true; seen.add(x); x=TASKS[x]?.parent; } return false; };
const goals = () => Object.keys(TASKS).filter(k=>k!=="Goal" && isSub(k,"Goal"));
const tl = id => TASKS[id] ? L(TASKS[id].label) : id;

function ground(text){
  const q = norm(text); let best=null;
  for(const g of goals()){
    const labels=[...(TASKS[g].alt?.vi||[]),...(TASKS[g].alt?.en||[]),TASKS[g].label.en,TASKS[g].label.vi];
    for(const lab of labels){ const n=norm(lab); if(q.includes(n) && (!best || n.length>best.lab.length)) best={goal:g,lab}; }
  }
  return best;
}
function degree(req,adv){
  if(req===adv) return "exact";
  if(isSub(req,adv)) return "plugin";
  if(isSub(adv,req)) return "subsumes";
  return "fail";
}
const DEGV = {exact:1, plugin:.8, subsumes:.5, fail:0};
function bestDegree(task,agent){ let b="fail"; for(const p of agent.provides){ const d=degree(task,p); if(DEGV[d]>DEGV[b]) b=d; } return b; }
function gateReasons(task,agent,deg){
  const r=[]; const T0=TASKS[task]||{};
  if(agent.draft) r.push({k:"r_draft"});
  if(!agent.attested) r.push({k:"r_attest"});
  if(!(deg==="exact"||deg==="plugin")) r.push({k:"r_deg"});
  if(T0.auth && !agent.auth.includes(T0.auth)) r.push({k:"r_auth",x:T0.auth});
  if(T0.dc && !agent.dc.includes(T0.dc)) r.push({k:"r_dc",x:T0.dc});
  return r;
}
function score(task,agent,deg){
  const dom = agent.domain===TASKS[task]?.domain ? 1 : .5;
  return +(.4*DEGV[deg] + .3*agent.trust + .1*(1-agent.cost) + .2*dom).toFixed(3);
}
function candidates(task){
  const out=[];
  for(const a of AGENTS){ const d=bestDegree(task,a); if(d==="fail") continue;
    const reasons=gateReasons(task,a,d); out.push({a,d,s:score(task,a,d),ok:!reasons.length,reasons}); }
  out.sort((x,y)=> (x.ok===y.ok ? y.s-x.s : (x.ok?-1:1)));
  return out;
}
function provided(task){ return AGENTS.some(a=>{const d=bestDegree(task,a); return d==="exact"||d==="plugin";}); }
function needsHitl(task,ctx){
  if(task==="ExecutePayment" && ctx && ctx.merchant && MERCHANTS[ctx.merchant]?.cross) return true;
  const covered = !!(ctx && ctx.mandate);
  return (TASKS[task]?.risk||0)>=3 && !covered;
}
function validate(goal,steps,ctx){
  const v=[]; const add=(c,step)=>v.push({c,step});
  const hasMand = !!(ctx && ctx.mandate);
  steps.forEach((s,i)=>{
    const T0=TASKS[s.task];
    if(!isTask(s.task)) add("N1",i+1);
    if(s.agent){
      if(T0?.auth && !s.agent.auth.includes(T0.auth)) add("N2",i+1);
      if(T0?.dc && !s.agent.dc.includes(T0.dc)) add("N3",i+1);
      if(!s.agent.attested) add("N6",i+1);
    }
    if(s.task==="ExecutePayment"){
      const prior = steps.slice(0,i).some(p=>p.task==="ObtainPaymentMandate");
      if(!prior && !hasMand) add("N4",i+1);
    }
    if((T0?.risk||0)>=3 && !s.hitl && !hasMand) add("N5",i+1);
  });
  if(ctx){
    const pays = steps.filter(s=>s.task==="ExecutePayment");
    const m = ctx.merchant && MERCHANTS[ctx.merchant];
    if(pays.length && m && !m.verified) add("C1",null);
    if(ctx.mandate && ctx.amount!=null && ctx.amount>ctx.mandate.cap) add("C2",null);
    if(ctx.mandate && ctx.mandate.cats.length && ctx.category && !ctx.mandate.cats.includes(ctx.category)) add("C3",null);
    if(ctx.mandate && ctx.mandate.days<0) add("C4",null);
    if(ctx.category && CATS[ctx.category]?.prohibited) add("C5",null);
    if(m && m.cross && pays.some(s=>!s.hitl)) add("C6",null);
  }
  if(goal==="DelegatedPurchase" && !hasMand) add("C7",null);
  return v;
}
function decompose(goal,ctx,trace,depth=0){
  if(depth>6) return null;
  if(METHODS[goal]){
    trace.method={goal,status:METHOD_STATUS[goal],subs:METHODS[goal]};
    const out=[]; for(const s of METHODS[goal]){ const r=decompose(s,ctx,trace,depth+1); if(!r) return null; out.push(...r); } return out;
  }
  if(provided(goal)) return [goal];
  const script = (LLM_SCRIPT[goal]||[]).slice();
  trace.llm=[];
  for(const prop of script){
    const steps = prop.map(x=>({task:x,hitl:needsHitl(x,ctx)}));
    const v = validate(goal,steps,ctx);
    trace.llm.push({prop,v});
    if(!v.length){ METHODS[goal]=prop; METHOD_STATUS[goal]="proposed"; trace.method={goal,status:"proposed",subs:prop}; return prop; }
  }
  return null;
}
function minimise(task,agent,payload){
  const need = TASKS[task]?.needs||[]; const sent=[], held=[];
  for(const k of Object.keys(payload)){
    if(FIELD_DC[k] && agent.dc.includes(FIELD_DC[k]) && need.includes(k)) sent.push(k); else if(need.includes(k)) held.push(k);
  }
  return {sent,held};
}
function baselineBind(task){
  let best=null; for(const a of AGENTS){ if(bestDegree(task,a)==="fail") continue; const v=a.trust-a.cost; if(!best||v>best.v) best={a,v}; }
  return best?.a||null;
}

const agentById = id => AGENTS.find(a=>a.id===id) || {id,label:{en:id,vi:id},dc:[],auth:[],provides:[]};
function adopt(res,keepText){
  const r={text:keepText, status:res.status==="rejected"?"rejected":res.status, rejectAt:res.rejectAt,
    pid:res.pid, g:res.g, trace:res.trace||{}, viol:res.viol||[], cmp:res.cmp, prov:res.prov||"",
    ctx:res.ctxUsed?true:null, remote:true};
  r.steps=(res.steps||[]).map(s=>({task:s.task,hitl:s.hitl,agent:agentById(s.agent),deg:s.deg}));
  r.bind=(res.bind||[]).map(b=>({task:b.task,
    best:b.best?{a:agentById(b.best.agent),d:b.best.d,s:b.best.s}:null,
    rejected:(b.rejected||[]).map(c=>({a:agentById(c.agent),s:c.s,reasons:c.reasons||[]}))}));
  r.exec=(res.exec||[]).map((e,i)=>({s:{task:e.task,agent:agentById(e.agent)},sent:e.sent||[],held:e.held||[],
    status:e.status,approved:e.approved}));
  r.i=r.exec.length;
  if(r.trace.llm) r.trace.llm=r.trace.llm.map(a=>({prop:a.prop,v:(a.v||[]).map(c=>({c}))}));
  return r;
}
async function runRemote(){
  const c=readCtx(), body={text:$("req").value.trim(), compare:$("compare").checked,
    product: currentScen?.product?L(currentScen.product):null};
  const goalIsCommerce=true;
  Object.assign(body,{amount:c.amount, merchant:c.merchant, category:c.category,

  const res=await fetch("api/orchestrate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});

/* ======================= Run state & rendering ======================= */
let RUN=null;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

function readCtx(){
  const mand = $("hasMandate").checked ? {cap:+$("cap").value||0, days:+$("validDays").value, cats:[...document.querySelectorAll("#mandCats input:checked")].map(i=>i.value)} : null;
  return {amount:+$("amount").value||0, merchant:$("merchant").value, category:$("category").value, mandate:mand};
}
async function orchestrate(){
  const text=$("req").value.trim(); if(!text){ $("req").focus(); return; }
  if(MODE==="live"){
    try{ await runRemote(); }catch(e){ $("ledger").innerHTML=`<div class="panel empty" style="color:var(--bad)">${t("engineErr")}</div>`; }
    return;
  }
  const r={text, ctxRaw:readCtx(), stage:{}, prov:[], exec:[], status:"running"};
  const g=ground(text); r.g=g;
  if(!g){ r.status="rejected"; r.rejectAt=1; RUN=r; render(); return; }
  const dom=TASKS[g.goal].domain; r.ctx = dom==="com" ? r.ctxRaw : null;
  const trace={}; const tasks=decompose(g.goal,r.ctx,trace); r.trace=trace;
  if(!tasks){ r.status="rejected"; r.rejectAt=2; RUN=r; render(); return; }
  r.steps=tasks.map(x=>({task:x,hitl:needsHitl(x,r.ctx)}));
  r.bind=[];
  for(const s of r.steps){
    const c=candidates(s.task); const best=c.find(x=>x.ok);
    r.bind.push({task:s.task,best,rejected:c.filter(x=>!x.ok)});
    if(!best){ r.status="rejected"; r.rejectAt=3; RUN=r; render(); return; }
    s.agent=best.a; s.deg=best.d; s.score=best.s;
  }
  r.viol=validate(g.goal,r.steps,r.ctx);
  if($("compare").checked){
    const bs=r.steps.map(s=>({task:s.task,hitl:s.hitl,agent:baselineBind(s.task)}));
    r.cmp={base:validate(g.goal,bs,r.ctx), baseSteps:bs};
  }
  if(r.viol.length){ r.status="rejected"; r.rejectAt=4; RUN=r; render(); return; }
  r.payload={...PROFILE, product: currentScen?.product ? L(currentScen.product) : text, quantity: currentScen?.q||1, citizen_request:text};
  if(r.ctx){ r.payload.amount=r.ctx.amount; r.payload.merchant=L(MERCHANTS[r.ctx.merchant].label); }
  r.pid = Math.random().toString(16).slice(2,10);
  r.i=0; RUN=r; advance();
}
function advance(){
  const r=RUN;
  while(r.i<r.steps.length){
    const s=r.steps[r.i];
    if(s.hitl && !s.approved){ r.status="waiting"; render(); return; }
    const m=minimise(s.task,s.agent,r.payload);
    r.exec.push({s,sent:m.sent,held:m.held,status:"done",approved:!!s.approved});
    r.i++;
  }
  r.status="completed"; render();
}
function decide(ok){
  if(MODE==="live"){ decideRemote(ok); return; }
  const r=RUN; const s=r.steps[r.i];
  if(ok){ s.approved=true; r.status="running"; advance(); }
  else { r.exec.push({s,sent:[],held:[],status:"denied"}); r.status="halted"; render(); }
}

function stageHTML(n,titleKey,state,body){
  const pill = {done:["ok","done"],rejected:["bad","rejected"],halted:["bad","halted"],waiting:["wait","waiting"],skipped:["skip","skipped"],completed:["ok","completed"]}[state];
  return `<article class="stage ${state==="skipped"?"skipped":""}"><div class="stage-h"><span class="stage-n" aria-hidden="true">${n}</span><h3>${t(titleKey)}</h3><span class="pill ${pill[0]}">${t(pill[1])}</span></div><div class="stage-b">${body}</div></article>`;
}
function reasonText(r){ const x=r.x?(AUTH[r.x]?L(AUTH[r.x]):DC[r.x]?L(DC[r.x]):r.x):null; return t(r.k)+(x?` (${esc(x)})`:""); }
function normTitle(c){ return L(NORMS.find(n=>n.c===c).t); }

function render(){
  const el=$("ledger"); const r=RUN;
  if(!r){ el.innerHTML=`<div class="panel empty">${t("emptyP")}</div>`; return; }
  const st = n => { if(r.status==="rejected" && r.rejectAt===n) return "rejected"; if(r.status==="rejected" && r.rejectAt<n) return "skipped"; return "done"; };
  let h="";
  // 1 grounding
  h+= stageHTML(1,"s1", st(1), r.g ? `<dl class="kv"><dt>${t("goal")}</dt><dd><b>${esc(tl(r.g.goal))}</b></dd><dt>${t("domain")}</dt><dd>${t(DOMAINS[TASKS[r.g.goal].domain])}</dd><dt>${t("matched")}</dt><dd>“${esc(r.g.lab)}”</dd></dl>` : `<p style="margin:0">${t("noGround")}</p>`);
  // 2 decomposition
  if(r.rejectAt===1){ h+=stageHTML(2,"s2","skipped","—"); }
  else {
    let b="";
    if(r.trace.llm){ b+=`<p style="margin:0 0 8px">${t("noMethod")}</p><ol class="loglist">`+ r.trace.llm.map((x,i)=>`<li class="${x.v.length?"rej":"acc"}">${t("llmTry")} ${i+1}: [${x.prop.map(p=>esc(TASKS[p]?tl(p):p+" ✗")).join(", ")}] — ${x.v.length? t("rejectedBy")+" "+[...new Set(x.v.map(v=>v.c))].join(", ") : t("accepted")}</li>`).join("")+`</ol>`; }
    if(r.trace.method){ b+=`<p style="margin:${r.trace.llm?"10px":"0"} 0 6px">${t("method")}: <b>${esc(tl(r.trace.method.goal))}</b> — ${t(r.trace.method.status)}</p><ol class="loglist">`+(r.steps||[]).map(s=>`<li>${esc(tl(s.task))}</li>`).join("")+`</ol>`; }
    h+=stageHTML(2,"s2",st(2),b||"—");
  }
  // 3 binding
  if(r.rejectAt && r.rejectAt<3){ h+=stageHTML(3,"s3","skipped","—"); }
  else {
    let b=`<div class="tbl-wrap"><table><thead><tr><th>${t("thStep")}</th><th>${t("thTask")}</th><th>${t("thAgent")}</th><th>${t("thDeg")}</th><th>${t("thScore")}</th><th>${t("thHitl")}</th></tr></thead><tbody>`;
    r.bind.forEach((x,i)=>{
      const s=r.steps[i];
      b+=`<tr><td>${i+1}</td><td>${esc(tl(x.task))}${x.rejected.map(c=>`<div class="excl">${t("excluded")}: <s>${esc(L(c.a.label))}</s> · S=${c.s} — ${c.reasons.map(reasonText).join("; ")}</div>`).join("")}</td><td>${x.best?esc(L(x.best.a.label)):`<span style="color:var(--bad)">${t("unbindable")}</span>`}</td><td>${x.best?`<span class="deg">${x.best.d}</span>`:""}</td><td>${x.best?x.best.s:""}</td><td>${s.hitl?t("yes"):t("no")}</td></tr>`;
    });
    b+=`</tbody></table></div>`;
    h+=stageHTML(3,"s3",st(3),b);
  }
  // 4 verification
  if(r.rejectAt && r.rejectAt<4){ h+=stageHTML(4,"s4","skipped","—"); }
  else {
    const fired=new Set(r.viol.map(v=>v.c));
    const applicable = c => c.startsWith("N") || !!r.ctx || c==="C7";
    let b=`<div class="seals">`+NORMS.map(n=>`<div class="seal ${!applicable(n.c)?"na":fired.has(n.c)?"fail":"pass"}"><div class="code">${n.c}</div><div class="t">${esc(L(n.t))}</div></div>`).join("")+`</div>`;
    b+= r.viol.length ? `<div class="viol"><b>${t("someFail")}</b><ul class="loglist">${r.viol.map(v=>`<li>${v.c} — ${esc(normTitle(v.c))} [${v.step?t("stepLbl")+" "+v.step:t("planLevel")}]</li>`).join("")}</ul></div>` : `<p style="margin:10px 0 0;color:var(--ok)">${t("allPass")}</p>`;
    if(r.cmp){
      b+=`<h4 style="margin:16px 0 8px;font-size:14px">${t("cmpH")}</h4><div class="compare"><div class="cmp ${r.cmp.base.length?"bad":"ok"}"><h4>${t("cmpBase")}</h4><div class="big">${r.cmp.base.length}</div><div class="muted">${t("viols")}${r.cmp.base.length?": "+[...new Set(r.cmp.base.map(v=>v.c))].join(", "):""}</div></div><div class="cmp ${r.viol.length?"bad":"ok"}"><h4>${t("cmpUs")}</h4><div class="big">${r.viol.length}</div><div class="muted">${t("viols")}</div></div></div><p class="muted" style="margin:8px 0 0">${t("cmpNote")}</p>`;
    }
    h+=stageHTML(4,"s4",st(4),b);
  }
  // 5 execution
  if(r.rejectAt){ h+=stageHTML(5,"s5","skipped","—"); }
  else {
    let b="";
    r.steps.forEach((s,i)=>{
      const e=r.exec[i];
      const state = e ? e.status : (i===r.i && r.status==="waiting" ? "waiting" : "");
      b+=`<div class="exec-step ${state}"><span class="exec-dot" aria-hidden="true"></span><div><div class="exec-title">${i+1}. ${esc(tl(s.task))} <span class="muted">← ${esc(L(s.agent.label))}</span></div>`;
      if(e && e.status==="done"){
        b+=`<div class="chips"><span class="muted" style="font-size:12px;margin-right:4px">${t("sent")}:</span>${e.sent.map(k=>`<span class="chip">${k}</span>`).join("")}${e.held.map(k=>`<span class="chip withheld" title="${t("withheld")}">${k}</span>`).join("")}${e.approved?`<span class="chip" style="border-color:var(--ok);color:var(--ok)">${t("approvedBy")}</span>`:""}</div>`;
      }
      if(e && e.status==="denied") b+=`<p style="margin:4px 0 0;color:var(--bad)">${t("declinedMsg")}</p>`;
      if(state==="waiting") b+=`<div class="hitl"><p>${t("approveQ")}</p><button class="btn primary" onclick="decide(true)">${t("approve")}</button><button class="btn danger" onclick="decide(false)">${t("decline")}</button></div>`;
      b+=`</div></div>`;
    });
    h+=stageHTML(5,"s5", r.status==="completed"?"completed": r.status==="halted"?"halted":"waiting", b);
  }
  // 6 provenance
  if(!r.rejectAt && r.exec.length){
    h+=stageHTML(6,"s6", r.status==="waiting"?"waiting":"done", `<p style="margin:0 0 6px">${t("provP")}</p><details><summary>${t("showTtl")}</summary><pre class="ttl">${esc(turtle(r))}</pre></details>`);
  }
  el.innerHTML=h;
}
function turtle(r){
  if(r.remote) return r.prov||"";
  const P=`plan:${r.pid}`; const who="person:user";
  let s=`@prefix prov: <http://www.w3.org/ns/prov#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix bka:  <https://ndta.gov.vn/ns/bizkb-a#> .\n@prefix plan: <https://ndta.gov.vn/plan/> .\n@prefix agent: <https://ndta.gov.vn/agent/> .\n@prefix person: <https://ndta.gov.vn/person/> .\n\n`;
  s+=`${P} a prov:Plan ; bka:taskType bka:${r.g.goal} .\n${P}-orch a prov:Activity ;\n  prov:wasAssociatedWith agent:bizkb-a-orchestrator${r.ctx?.mandate?` ;\n  prov:used ${P}-mandate`:""} .\nagent:bizkb-a-orchestrator prov:actedOnBehalfOf ${who} .\n`;
  if(r.ctx?.mandate) s+=`${P}-mandate a prov:Entity, bka:IntentMandate ;\n  prov:wasAttributedTo ${who} ; bka:maxAmount ${r.ctx.mandate.cap} .\n`;
  r.exec.forEach((e,i)=>{
    s+=`\n${P}-step${i+1} a prov:Activity ;\n  bka:taskType bka:${e.s.task} ;\n  prov:wasInformedBy ${P}-orch ;\n  prov:wasAssociatedWith agent:${e.s.agent.id} ;\n  rdfs:comment "${e.status==="done"?"completed":"denied-by-human"}"`;
    if(e.approved) s+=` ;\n  bka:approvedBy ${who}`;
    e.sent.forEach(k=> s+=` ;\n  bka:disclosedField "${k}"`);
    s+=` .\nagent:${e.s.agent.id} prov:actedOnBehalfOf ${who} .\n`;
  });
  return s;
}

function annotate(){
  const tasks=Object.keys(TASKS).filter(k=>TASKS[k].domain==="com" && !isSub(k,"Goal"));
  const mapped=[], unmapped=[];
  for(const sk of CARD.skills){

$("hasMandate").onchange=syncMandate;
$("annotBtn").onclick=annotate;
$("req").addEventListener("input",()=>{ currentScen=null; document.querySelectorAll(".scen").forEach(b=>b.setAttribute("aria-pressed","false")); });
function showTab(which){
  $("view-run").classList.toggle("hide",which!=="run"); $("view-kb").classList.toggle("hide",which!=="kb");
  $("tab-run").setAttribute("aria-selected",which==="run"); $("tab-kb").setAttribute("aria-selected",which==="kb");
}
$("tab-run").onclick=()=>showTab("run"); $("tab-kb").onclick=()=>showTab("kb");
applyLang(); loadScen("G1"); detectEngine();
</script>
